<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
<a href="order.html" class="bento-item large">
  <div class="icon-box">🛒</div>
  <div class="title">اطلب الآن</div>
</a>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;700;900&display=swap');

    :root {
      --primary: #4F6F52; /* زيتوني نيشا */
      --accent: #F2E8D8;  /* بيج نيشا */
      --dark: #1A1C1E;
      --white: #ffffff;
      --bg-body: #F9F7F2;
      --shadow: 0 10px 30px rgba(0,0,0,0.08);
      --radius: 20px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0;
      font-family: 'Alexandria', sans-serif;
      background-color: var(--bg-body);
      color: var(--dark);
      overflow-x: hidden;
    }

    /* === Header === */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(15px);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(79, 111, 82, 0.1);
    }

    .logo-area { display: flex; align-items: center; gap: 10px; }
    /* تصغير الأيقونة حسب طلبك */
    .logo-mark {
      width: 35px; height: 35px; 
      background: var(--primary);
      border-radius: 10px;
      display: grid; place-items: center;
      color: var(--white);
      font-weight: 900; font-size: 18px;
    }
    .brand-name { font-weight: 900; font-size: 1.1rem; color: var(--primary); }

    /* === Hero Slider === */
    .hero {
      width: 100%; height: 220px;
      position: relative; overflow: hidden;
    }
    .slide {
      position: absolute; inset: 0; opacity: 0; transition: 1s;
      background-size: cover; background-position: center;
      display: flex; align-items: flex-end; padding: 25px;
    }
    .slide.active { opacity: 1; }
    .slide-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.7), transparent); }
    .slide-content { position: relative; color: white; z-index: 2; }
    .slide-content h2 { margin: 0; font-size: 1.4rem; }

    /* === Categories Navigation === */
    .cats-nav {
      display: flex; gap: 10px; padding: 15px 20px;
      overflow-x: auto; position: sticky; top: 56px;
      background: var(--bg-body); z-index: 900;
      scrollbar-width: none;
    }
    .cats-nav::-webkit-scrollbar { display: none; }
    .cat-item {
      padding: 8px 18px; background: white; border-radius: 50px;
      white-space: nowrap; font-weight: 700; font-size: 0.85rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05); cursor: pointer;
    }
    .cat-item.active { background: var(--primary); color: white; }

    /* === Menu Grid === */
    .menu-wrap { padding: 10px 20px 120px; }
    .section-title { 
      font-weight: 900; font-size: 1.2rem; color: var(--primary); 
      margin: 25px 0 15px; display: flex; align-items: center; gap: 8px;
    }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px;
    }

    .card {
      background: white; border-radius: var(--radius); overflow: hidden;
      box-shadow: var(--shadow); position: relative; transition: 0.3s;
    }
    .card img { width: 100%; height: 130px; object-fit: cover; background: #f0f0f0; }
    .card-body { padding: 12px; }
    .card-name { font-weight: 700; font-size: 0.9rem; margin-bottom: 5px; }
    .card-price { font-weight: 900; color: var(--primary); font-size: 1rem; }

    .add-btn {
      position: absolute; bottom: 10px; left: 10px;
      width: 32px; height: 32px; background: var(--primary);
      color: white; border-radius: 8px; display: grid; place-items: center;
      font-weight: bold; cursor: pointer;
    }

    /* === Cart Float === */
    .cart-float {
      position: fixed; bottom: 20px; left: 20px; right: 20px;
      background: var(--primary); color: white; padding: 15px 25px;
      border-radius: 18px; display: none; justify-content: space-between;
      align-items: center; box-shadow: 0 10px 25px rgba(79, 111, 82, 0.4); z-index: 2000;
    }

    /* === Modal === */
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: none; z-index: 3000; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-content {
      background: white; width: 100%; max-width: 500px;
      border-radius: 25px; padding: 25px; max-height: 90vh; overflow-y: auto;
    }
    input, select, textarea {
      width: 100%; padding: 12px; margin: 8px 0 15px;
      border: 1px solid #eee; border-radius: 12px; background: #f9f9f9;
    }
    .order-confirm-btn {
      width: 100%; padding: 15px; background: var(--primary);
      color: white; border: none; border-radius: 15px; font-weight: 900; cursor: pointer;
    }

    @media (min-width: 768px) {
      .grid { grid-template-columns: repeat(4, 1fr); }
      .hero { height: 350px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-area">
      <div class="logo-mark">N</div>
      <div class="brand-name">نيشا NEESHA</div>
    </div>
    <div style="font-size: 0.7rem; font-weight: 700; color: #777;">اطلب الآن وسنصلك</div>
  </header>

  <div class="hero">
    <div class="slide active" style="background-image: url('https://images.unsplash.com/photo-1513104890138-7c749659a591?w=800')">
      <div class="slide-overlay"></div>
      <div class="slide-content"><h2>بيتزا نيشا المميزة</h2><p>عجينة هشة ومكونات طازجة</p></div>
    </div>
    <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1519869325930-281384150729?w=800')">
      <div class="slide-overlay"></div>
      <div class="slide-content"><h2>خلية النحل الهشة</h2><p>طعم الحلاوة في كل قطعة</p></div>
    </div>
  </div>

  <nav class="cats-nav" id="catsNav"></nav>

  <main class="menu-wrap" id="menuWrap"></main>

  <div class="cart-float" id="cartFloat" onclick="openModal()">
    <div style="display: flex; align-items: center; gap: 12px;">
      <span id="cartCount" style="background: white; color: var(--primary); padding: 2px 10px; border-radius: 8px; font-weight: 900;">0</span>
      <span style="font-weight: 700;">سلة الطلبات</span>
    </div>
    <div id="cartTotal" style="font-weight: 900;">0 ر.س</div>
  </div>

  <div class="modal" id="orderModal">
    <div class="modal-content">
      <h2 style="color: var(--primary); margin-top: 0;">تأكيد الطلب 🥯</h2>
      <div id="orderList" style="margin-bottom: 20px; font-size: 0.9rem;"></div>
      
      <label>الاسم</label>
      <input type="text" id="cName" placeholder="مثال: محمد">
      <label>رقم الجوال</label>
      <input type="tel" id="cPhone" placeholder="05xxxxxxxx">
      <label>الاستلام</label>
      <select id="cType">
        <option value="pickup">استلام من الفرع</option>
        <option value="delivery">توصيل للموقع</option>
      </select>
      <button class="order-confirm-btn" onclick="sendWhatsApp()">إرسال عبر واتساب</button>
      <button onclick="closeModal()" style="width:100%; background:none; border:none; margin-top:10px; color:#999;">إلغاء</button>
    </div>
  </div>

  <script>
    const WA_NUM = "966558608699";

    // الداتا الكاملة (أكثر من 50 صنفاً)
    const MENU_DATA = [
      { section: "🥙 المناقيش", items: [

        { name: "مناقيش مكس أجبان", price: 12, img: "https://raw.githubusercontent.com/obad-omar/naisha/c357f8239142717af50a264157216225db140449/images/WhatsApp%20Image%202026-01-29%20at%2011.57.10%20PM.jpeg" },
        { name: "مناقيش زعتر", price: 9, img: "https://raw.githubusercontent.com/obad-omar/naisha/c357f8239142717af50a264157216225db140449/images/WhatsApp%20Image%202026-01-29%20at%2011.35.02%20PM.jpeg" },
        { name: "مناقيش محمرة", price: 9, img: "https://raw.githubusercontent.com/obad-omar/naisha/c357f8239142717af50a264157216225db140449/images/WhatsApp%20Image%202026-01-30%20at%2012.01.16%20AM.jpeg" },
        { name: "مناقيش لبنة", price: 9, img: "https://raw.githubusercontent.com/obad-omar/naisha/c357f8239142717af50a264157216225db140449/images/WhatsApp%20Image%202026-01-29%20at%2011.52.32%20PM.jpeg" },
        { name: "مناقيش عكاوي", price: 9, img: "https://raw.githubusercontent.com/obad-omar/naisha/c357f8239142717af50a264157216225db140449/images/WhatsApp%20Image%202026-01-29%20at%2011.56.51%20PM.jpeg" },
        { name: "مناقيش جبن سائل", price: 9, img: "https://raw.githubusercontent.com/obad-omar/naisha/c357f8239142717af50a264157216225db140449/images/WhatsApp%20Image%202026-01-29%20at%2011.58.52%20PM.jpeg" }
      ]},
      { section: "🐝 الخلية", items: [
        { name: "خلية كلاسيك صغير", price: 16, img: "https://images.unsplash.com/photo-1519869325930-281384150729?w=300" },
        { name: "خلية كلاسيك كبير", price: 35, img: "https://images.unsplash.com/photo-1519869325930-281384150729?w=300" },

      ]},
      { section: "🥐 ميني معجنات", items: [
        { name: "ميني أقمار", price: 9, img: "" },
        { name: "أنصاف قمر دجاج", price: 9, img: "" },
        { name: "أنصاف قمر جبن", price: 9, img: "" },
        { name: "ميني كاب", price: 9, img: "" }
      ]},
      { section: "➕ إضافات", items: [
        { name: "سمبوسة جبن", price: 9, img: "" },
        { name: "سمبوسة دجاج", price: 9, img: "" },
        { name: "حساوي", price: 10, img: "" },
        { name: "أنصاف حساوي", price: 9, img: "" },
        { name: "بسبوسة", price: 10, img: "" },
        { name: "ورق عنب", price: 30, img: "https://raw.githubusercontent.com/obad-omar/naisha/9bc9b7726a8d2134cae2c7f447121215b975ea1a/images/WhatsApp%20Image%202026-01-21%20at%209.24.05%20PM%20(1).jpeg" },
        { name: "حلا نيشا", price: 10, img: "" }
      ]},
      { section: "🍳 حمسات", items: [
        { name: "حمسة دجاج", price: 12, img: "" },
        { name: "حمسة لحم", price: 13, img: "" },
        { name: "حمسة بيض", price: 11, img: "" },
        { name: "حمسة خضار", price: 11, img: "" },
        { name: "بوكس صباحيات", price: 60, img: "" },
        { name: "بوكس أمسية", price: 100, img: "" }
      ]},
      { section: "🍕 البيتزا", items: [
        { name: "بيتزا دجاج", price: 13, img: "https://raw.githubusercontent.com/obad-omar/naisha/9bc9b7726a8d2134cae2c7f447121215b975ea1a/images/WhatsApp%20Image%202026-01-21%20at%209.24.07%20PM.jpeg" },
        { name: "بيتزا ببروني", price: 16, img: "https://raw.githubusercontent.com/obad-omar/naisha/07db7cffb2fd672b11d84d1cb48278c824595826/images/WhatsApp%20Image%202026-01-27%20at%2011.51.14%20PM.jpeg" },
        { name: "بيتزا نقانق", price: 16, img: "https://raw.githubusercontent.com/obad-omar/naisha/07db7cffb2fd672b11d84d1cb48278c824595826/images/WhatsApp%20Image%202026-01-27%20at%2011.53.42%20PM.jpeg" },
        { name: "بيتزا لحم", price: 18, img: "https://raw.githubusercontent.com/obad-omar/naisha/07db7cffb2fd672b11d84d1cb48278c824595826/images/WhatsApp%20Image%202026-01-27%20at%2011.55.03%20PM.jpeg" },
        { name: "بيتزا رانش", price: 18, img: "https://raw.githubusercontent.com/obad-omar/naisha/07db7cffb2fd672b11d84d1cb48278c824595826/images/WhatsApp%20Image%202026-01-27%20at%2011.58.54%20PM.jpeg" },
        { name: "بيتزا خضار", price: 16, img: "https://raw.githubusercontent.com/obad-omar/naisha/9bc9b7726a8d2134cae2c7f447121215b975ea1a/images/WhatsApp%20Image%202026-01-21%20at%209.24.05%20PM.jpeg" },
        { name: "بيتزا باربكيو", price: 18, img: "" },
        { name: "بيتزا مارجريتا", price: 16, img: "https://raw.githubusercontent.com/obad-omar/naisha/c578c458b1a49211a3eedde8deea8d139e51fbd7/images/WhatsApp%20Image%202026-01-28%20at%2012.15.16%20AM.jpeg" },
        { name: "بيتزا شاورما", price: 17, img: "" }
      ]},
      { section: "🌯 شاورما", items: [
        { name: "شاورما صاروخ", price: 12, img: "" },
        { name: "عربي كبير", price: 28, img: "" },
        { name: "عربي صغير", price: 14, img: "" },
        { name: "ساندوتش شاورما", price: 7, img: "" },
        { name: "شاورما عائلي", price: 45, img: "" },
        { name: "شاورما نيشا", price: 100, img: "" }
      ]},
      { section: "📦 بوكسات", items: [
        { name: "بوكس لمتنا", price: 23, img: "" },
        { name: "بوكس جمعتنا", price: 49, img: "" },
        { name: "بوكس نيشا", price: 60, img: "" },
        { name: "بوكس نيشا بلس", price: 80, img: "" }
      ]}
    ];

    let cart = {};

    function init() {
      const nav = document.getElementById('catsNav');
      const wrap = document.getElementById('menuWrap');
      
      MENU_DATA.forEach((sec, idx) => {
        // Nav
        const btn = document.createElement('div');
        btn.className = `cat-item ${idx === 0 ? 'active' : ''}`;
        btn.textContent = sec.section.replace(/[^\u0621-\u064A\s]/g, '');
        btn.onclick = () => scrollToSection(idx, btn);
        nav.appendChild(btn);

        // Section
        const sDiv = document.createElement('div');
        sDiv.id = `sec-${idx}`;
        sDiv.innerHTML = `<div class="section-title">${sec.section}</div>`;
        const grid = document.createElement('div');
        grid.className = 'grid';

        sec.items.forEach(item => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <img src="${item.img}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/150?text=Neesha'">
            <div class="card-body">
              <div class="card-name">${item.name}</div>
              <div class="card-price">${item.price} ر.س</div>
              <div class="add-btn" onclick="addToCart('${item.name}', ${item.price})">+</div>
            </div>
          `;
          grid.appendChild(card);
        });
        sDiv.appendChild(grid);
        wrap.appendChild(sDiv);
      });
      startSlider();
    }

    function addToCart(name, price) {
      if (cart[name]) cart[name].qty++;
      else cart[name] = { price, qty: 1 };
      updateCartUI();
      document.getElementById('cartFloat').style.display = 'flex';
    }

    function updateCartUI() {
      let count = 0, total = 0;
      for (let n in cart) {
        count += cart[n].qty;
        total += cart[n].qty * cart[n].price;
      }
      document.getElementById('cartCount').textContent = count;
      document.getElementById('cartTotal').textContent = total + " ر.س";
    }

    function sendWhatsApp() {
      const name = document.getElementById('cName').value;
      if (!name) return alert("فضلاً ادخل الاسم");
      let msg = `*طلب جديد من نيشا:*\nالاسم: ${name}\n\n*الطلبات:*\n`;
      let total = 0;
      for (let n in cart) {
        msg += `- ${n} (${cart[n].qty})\n`;
        total += cart[n].qty * cart[n].price;
      }
      msg += `\n*الإجمالي: ${total} ر.س*`;
      window.open(`https://wa.me/${WA_NUM}?text=${encodeURIComponent(msg)}`);
    }

    function scrollToSection(id, btn) {
      document.querySelectorAll('.cat-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(`sec-${id}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function startSlider() {
      let current = 0;
      const slides = document.querySelectorAll('.slide');
      setInterval(() => {
        slides[current].classList.remove('active');
        current = (current + 1) % slides.length;
        slides[current].classList.add('active');
      }, 4000);
    }

    function openModal() { document.getElementById('orderModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('orderModal').style.display = 'none'; }

    init();
  </script>
</body>
</html>
